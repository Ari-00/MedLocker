services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MEDLOCKER_DOMAIN: ${MEDLOCKER_DOMAIN:?Set the MedLocker DNS hostname}
    ports:
      - "${MEDLOCKER_PUBLIC_BIND:-0.0.0.0}:80:80"
      - "${MEDLOCKER_PUBLIC_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - ${MEDLOCKER_ENV_FILE:-.env.production}
    environment:
      MEDLOCKER_BIND_ADDRESS: 0.0.0.0
      MEDLOCKER_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      MEDLOCKER_MINIO_ENDPOINT: http://minio:9000
      MEDLOCKER_MASTER_KEY: ${MEDLOCKER_MASTER_KEY:?Set a separate 32-byte Base64 master key}
      MEDLOCKER_JWT_SECRET: ${MEDLOCKER_JWT_SECRET:?Set a separate 32-byte Base64 JWT secret}
      MEDLOCKER_PIN_PEPPER: ${MEDLOCKER_PIN_PEPPER:?Set a separate 32-byte Base64 PIN pepper}
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
      SERVER_TOMCAT_REDIRECT_CONTEXT_ROOT: "false"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    build:
      context: ./docker/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
